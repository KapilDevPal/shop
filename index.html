<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Indian Space Hub Store — Official Merchandise</title>
    <meta name="description" content="Toys, apparel and collectibles inspired by India's journey into space. Shop ISRO-inspired merchandise at Indian Space Hub. Express interest and unlock limited drops." />
    <meta name="keywords" content="Indian Space Hub, ISRO merchandise, space apparel, Gaganyaan hoodie, Indian space collectibles, space store India" />
    <link rel="canonical" href="https://shop.indianspacehub.com/" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shop.indianspacehub.com/" />
    <meta property="og:title" content="Indian Space Hub Store — Official Merchandise" />
    <meta property="og:description" content="Wear India's space story. Shop ISRO-inspired apparel, collectibles and toys. Limited drops unlocked by community interest." />
    <meta property="og:site_name" content="Indian Space Hub Store" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Indian Space Hub Store" />
    <meta name="twitter:description" content="Wear India's space story. Limited merchandise drops unlocked by community interest." />

    <!-- Favicon & Social Image -->
    <link rel="icon" type="image/png" href="/indian_space_hub_logo.png" />
    <meta property="og:image" content="https://shop.indianspacehub.com/indian_space_hub_logo.png" />
    <meta name="twitter:image" content="https://shop.indianspacehub.com/indian_space_hub_logo.png" />

    <!-- Google Fonts — preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#F6F4EF" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
